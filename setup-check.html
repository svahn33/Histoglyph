<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="assets/Histoglyph_image.png"><link rel="apple-touch-icon" href="assets/Histoglyph_image.png"><meta name="robots" content="noindex, nofollow, noarchive"><title>Histoglyph Supabase check</title><link rel="stylesheet" href="styles.css"></head><body><main class="game-shell"><a class="play-brand" href="/"><img class="brand-logo" src="assets/Histoglyph_image.png" alt="" aria-hidden="true"><span>Histoglyph</span></a><section class="answer-card"><p class="eyebrow">Technical setup</p><h1>Supabase connection check</h1><div id="setup-results" class="setup-check-list" aria-live="polite"></div></section></main><script type="module">import {isSupabaseConfigured,supabase} from './js/supabase-client.js';const box=document.querySelector('#setup-results');function row(ok,title,detail){const d=document.createElement('div');d.className='setup-check-row';d.innerHTML=`<strong>${ok?'✓':'✕'} ${title}</strong><span>${detail}</span>`;box.append(d);}row(isSupabaseConfigured(),'Client configuration',isSupabaseConfigured()?'Project URL and publishable key are present.':'Edit supabase-config.js.');if(supabase){const {data,error}=await supabase.rpc('list_life_map_collections');row(!error,'Database functions',error?.message||`${data?.length||0} collections returned.`);const {data:{session}}=await supabase.auth.getSession();row(Boolean(session),'Admin session',session?.user?.email||'Not signed in; this is normal for public gameplay.');}</script></body></html>
